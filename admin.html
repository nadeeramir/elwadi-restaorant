<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوادي | إدارة المطعم</title><style>:root{font-family:Tahoma,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17130f;color:#fff2dc}header{padding:18px;background:#302015;border-bottom:2px solid #dca74e;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;color:#e5ad4d;margin:0}main{max-width:1050px;margin:auto;padding:18px}.card{background:#291e16;border:1px solid #60482c;border-radius:14px;padding:18px;margin:12px 0}input,button,select{font:inherit;border-radius:8px;padding:12px}input{width:100%;background:#15100d;border:1px solid #765d40;color:white;margin:8px 0}button{background:#e5ad4d;border:0;color:#21170d;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#4b3525;color:white}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#c4b49d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.pill{padding:5px 9px;border-radius:18px;background:#4b3824;font-size:12px}.hidden{display:none!important}.error{color:#ffad9b}.ok{color:#bce4ac}select{background:#18120d;color:white;border:1px solid #80603c;max-width:100%}ul{padding-right:20px}li{margin:6px 0}#notice{position:sticky;top:0;z-index:5;background:#785119;padding:10px;border-radius:8px;display:none}#login{max-width:430px;margin:50px auto}#orders{min-height:80px}</style></head><body><header><div><h1>مطعم الوادي | لوحة الإدارة</h1><div class="muted">الطلبات والحجوزات · نسخة اختبار</div></div><button id="logout" class="secondary hidden">تسجيل خروج</button></header><main><div id="notice"></div><section id="login" class="card"><h2>دخول الموظفين</h2><form id="loginForm"><label>البريد الإلكتروني<input type="email" id="email" required autocomplete="username"></label><label>كلمة المرور<input type="password" id="password" required autocomplete="current-password"></label><button id="loginBtn">تسجيل الدخول</button></form><p id="loginError" class="error"></p></section><section id="dashboard" class="hidden"><div class="flex"><div class="card">الطلبات الجديدة: <strong id="newCount">0</strong></div><div class="card">إجمالي الطلبات المعروضة: <strong id="allCount">0</strong></div><button id="refresh">تحديث الآن</button><button id="sound">تفعيل صوت التنبيه</button></div><p class="muted">يتم التحديث تلقائيًا كل 10 ثوانٍ أثناء فتح الصفحة. إشعارات الموبايل والكمبيوتر في الخلفية تحتاج إعداد Web Push لاحقًا.</p><h2>الطلبات</h2><div id="orders" class="grid"></div><h2>الحجوزات</h2><div id="reservations" class="grid"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://upbugqrqokcaefjozghf.supabase.co';
const KEY='sb_publishable_wRHKs3WUDoSSsDUloU7UWQ_GyqHaCAw';
const sb=createClient(URL,KEY);const $=id=>document.getElementById(id);let timer=null,known=new Set(),loaded=false,soundEnabled=false,audioContext=null;
const statuses={new:'جديد',accepted:'مقبول',preparing:'جاري التحضير',ready:'جاهز',completed:'مكتمل',cancelled:'ملغي'};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
function flash(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',5000)}
function beep(){if(!soundEnabled)return;try{const a=audioContext||(audioContext=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.09;o.start();o.stop(a.currentTime+.25)}catch{}}
$('sound').onclick=async()=>{soundEnabled=true;try{audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();beep();$('sound').textContent='الصوت مفعّل'}catch{flash('تعذر تشغيل الصوت على الجهاز')}};
async function checkStaff(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data,error}=await sb.from('staff_profiles').select('role').eq('user_id',user.id).maybeSingle();return !error&&!!data&&['admin','staff'].includes(data.role)}
async function load(){const {data:orders,error}=await sb.from('orders').select('id,customer_name,customer_phone,order_items,total_amount,order_type,delivery_address,delivery_fee,notes,status,created_at').order('created_at',{ascending:false}).limit(100);if(error){flash('تعذر تحميل الطلبات: '+error.message);return}const ids=new Set((orders||[]).filter(o=>o.status==='new').map(o=>o.id));if(loaded&&[...ids].some(id=>!known.has(id))){beep();flash('وصل طلب جديد!')}known=ids;loaded=true;$('newCount').textContent=ids.size;$('allCount').textContent=orders.length;
$('orders').innerHTML=orders.length?orders.map(o=>`<article class="card"><div class="flex"><strong>طلب ${safe(o.id.slice(0,8).toUpperCase())}</strong><span class="pill">${safe(statuses[o.status]||o.status)}</span></div><p>${safe(o.customer_name)} · <span dir="ltr">${safe(o.customer_phone)}</span></p><p class="muted">${new Date(o.created_at).toLocaleString('ar-EG')}</p><p>${o.order_type==='delivery'?'دليفري':'استلام من المحل'}</p>${o.delivery_address?`<p>العنوان: ${safe(o.delivery_address)}</p>`:''}<ul>${(Array.isArray(o.order_items)?o.order_items:[]).map(i=>`<li>${safe(i.name)} × ${safe(i.quantity)}</li>`).join('')}</ul><p>الدليفري: ${money(o.delivery_fee)} · <strong>الإجمالي: ${money(o.total_amount)}</strong></p>${o.notes?`<p>ملاحظات: ${safe(o.notes)}</p>`:''}<div class="flex"><select aria-label="حالة الطلب" data-id="${safe(o.id)}">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select><button data-save="${safe(o.id)}">حفظ الحالة</button></div></article>`).join(''):'<p>لا توجد طلبات حاليًا.</p>';
$('orders').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.save;const status=$('orders').querySelector(`select[data-id="${id}"]`).value;const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)flash('تعذر تحديث الطلب: '+error.message);else flash('تم تحديث حالة الطلب');b.disabled=false;await load()});
const r=await sb.from('reservations').select('id,customer_name,customer_phone,table_number,reservation_time,guests,status').order('reservation_time',{ascending:true}).limit(100);$('reservations').innerHTML=r.error?`<p class="error">تعذر تحميل الحجوزات: ${safe(r.error.message)}</p>`:r.data.length?r.data.map(x=>`<div class="card"><strong>ترابيزة ${safe(x.table_number)}</strong> · ${safe(x.status)}<p>${safe(x.customer_name)} · ${safe(x.customer_phone)}</p><p>${new Date(x.reservation_time).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'})} · ${safe(x.guests)} أشخاص</p></div>`).join(''):'<p>لا توجد حجوزات حاليًا.</p>';
}
async function start(){const valid=await checkStaff();$('login').classList.toggle('hidden',valid);$('dashboard').classList.toggle('hidden',!valid);$('logout').classList.toggle('hidden',!valid);if(timer)clearInterval(timer);if(valid){loaded=false;await load();timer=setInterval(load,10000)}else{const {data:{session}}=await sb.auth.getSession();if(session)flash('الحساب ليس ضمن الموظفين المصرح لهم')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginError').textContent='بيانات الدخول غير صحيحة أو الحساب غير مفعّل';return} $('password').value='';await start()};
$('logout').onclick=async()=>{await sb.auth.signOut();await start()};$('refresh').onclick=load;await start();
</script></body></html>
